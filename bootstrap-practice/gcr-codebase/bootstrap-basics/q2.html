<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devraj - Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light">

    <header class="text-center py-5 bg-dark text-white">
        <div class="container">
            <h1 class="fw-bold mb-1">Devraj Singh</h1>
            <p class="lead text-white-50">Full Stack Developer | MERN Stack Enthusiast</p>
        </div>
    </header>

    <main class="container text-center mt-5">
        <img src="https://placehold.co/200x200" alt="Profile Photo" class="img-fluid rounded-circle mb-4 shadow">

        <p class="fw-bold fs-5 mb-4">
            Building clean, functional web applications one project at a time.
        </p>

        <div class="mb-5">
            <button class="btn btn-primary mt-4 me-2 px-4">Hire Me</button>
            <button class="btn btn-outline-dark mt-4 px-4">Download CV</button>
        </div>

        <section class="bg-white p-5 rounded-3 shadow-sm mb-5 text-start mx-auto" style="max-width: 600px;">
            <h3 class="text-center fw-bold mb-4">Get in Touch</h3>
            <form>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" placeholder="Your name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="3" placeholder="Say something..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="text-center py-3 bg-dark text-white-50">
        <p class="mb-0">&copy; 2026 Devraj Singh. All rights reserved.</p>
    </footer>

</body>
</html>
