<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive CSS Cheat Sheet</title>
	<link rel="stylesheet" href="q6.css">
</head>
<body>
	<header>
		<h1>Responsive CSS Cheat Sheet</h1>
	</header>
	<main class="cheat-grid">
		<section class="cheat-box">
			<h2>Filters</h2>
			<p>filter: blur(5px) grayscale(100%) sepia(100%);</p>
		</section>
		<section class="cheat-box">
			<h2>Media Queries</h2>
			<p>@media (max-width: 600px) { ... }</p>
		</section>
		<section class="cheat-box">
			<h2>Responsive Design</h2>
			<p>Layouts that adapt fluidly to any screen size.</p>
		</section>
		<section class="cheat-box">
			<h2>Typography</h2>
			<p>font-size: clamp(1rem, 2vw, 1.5rem);</p>
		</section>
	</main>
</body>
</html>
