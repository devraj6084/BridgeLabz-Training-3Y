<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>
        <section>
            <h2>Attribute Selectors</h2>
            <a href="https://example.com">Secure Link</a>
            <br>
            <a href="http://example.com">Normal Link</a>
            <br>
            <input type="text" placeholder="Text input">
        </section>

        <section>
            <h2>Pseudo-classes</h2>
            <ul class="list">
                <li>Item One</li>
                <li>Item Two</li>
                <li>Item Three</li>
                <li>Item Four</li>
            </ul>
        </section>

        <section>
            <h2>Pseudo-elements</h2>
            <p class="quote">This is a sample paragraph used to show before and after content.</p>
        </section>
    </main>
</body>
</html>
