<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>
    <header>
        <h1>Feedback Form</h1>
    </header>

    <main>
        <form class="form">
            <label for="fname">Name</label>
            <input type="text" id="fname" placeholder="Enter your name">

            <label for="femail">Email</label>
            <input type="text" id="femail" placeholder="Enter your email">

            <label for="fmsg">Message</label>
            <textarea id="fmsg" rows="4" placeholder="Enter your message"></textarea>

            <button type="button">Submit</button>
        </form>
    </main>
</body>
</html>
