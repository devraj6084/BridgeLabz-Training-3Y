<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <header>
        <h1>Borders and Padding</h1>
    </header>

    <main class="box-row">
        <div class="box solid">
            <h2>Solid</h2>
            <p>padding: 10px</p>
        </div>

        <div class="box dashed">
            <h2>Dashed</h2>
            <p>padding: 20px</p>
        </div>

        <div class="box double">
            <h2>Double</h2>
            <p>padding: 15px</p>
        </div>

        <div class="box groove">
            <h2>Groove</h2>
            <p>border-radius: 12px</p>
        </div>
    </main>
</body>
</html>
