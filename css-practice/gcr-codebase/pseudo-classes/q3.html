<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header>
        <h1>Image Showcase</h1>
    </header>

    <main class="gallery">
        <figure class="img-card">
            <div class="img-wrap">
                <img src="https://picsum.photos/300/200?random=1" alt="Image One">
            </div>
            <figcaption>Image One</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="https://picsum.photos/300/200?random=2" alt="Image Two">
            </div>
            <figcaption>Image Two</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="https://picsum.photos/300/200?random=3" alt="Image Three">
            </div>
            <figcaption>Image Three</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="https://picsum.photos/300/200?random=4" alt="Image Four">
            </div>
            <figcaption>Image Four</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="https://picsum.photos/300/200?random=5" alt="Image Five">
            </div>
            <figcaption>Image Five</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="https://picsum.photos/300/200?random=6" alt="Image Six">
            </div>
            <figcaption>Image Six</figcaption>
        </figure>
    </main>
</body>
</html>
