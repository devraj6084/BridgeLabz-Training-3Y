<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q7.css">
</head>
<body class="bg-light">

    <header class="bg-white border-bottom py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="fw-bold m-0">My Tasks</h2>
            <span class="badge bg-primary rounded-pill fs-6">3 Pending</span>
        </div>
    </header>

    <main class="container mb-5">
        <div class="card shadow-sm">
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Finish MERN inventory project
                    <span class="badge bg-danger rounded-pill">High</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Revise DSA graph algorithms
                    <span class="badge bg-warning text-dark rounded-pill">Medium</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Update portfolio website
                    <span class="badge bg-success rounded-pill">Low</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center text-muted">
                    <span class="text-decoration-line-through">Submit assignment 9</span>
                    <button class="btn btn-sm btn-outline-success">
                        Completed <span class="badge bg-success ms-1">1</span>
                    </button>
                </li>
            </ul>
        </div>
    </main>

</body>
</html>
