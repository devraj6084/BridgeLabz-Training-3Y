<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q8.css">
</head>
<body class="bg-light">

    <header class="text-center py-5">
        <h1 class="fw-bold">Choose Your Plan</h1>
        <p class="text-muted">Simple pricing, no hidden fees</p>
    </header>

    <main class="container mb-5">
        <div class="row g-4 justify-content-center">

            <div class="col-md-4">
                <div class="card h-100 pricing-card shadow-sm text-center">
                    <div class="card-body">
                        <h4 class="card-title">Basic</h4>
                        <h2 class="fw-bold my-3">Rs. 0<span class="fs-6 text-muted">/mo</span></h2>
                        <ul class="list-unstyled text-muted">
                            <li class="mb-2">1 Project</li>
                            <li class="mb-2">Community Support</li>
                            <li class="mb-2">1 GB Storage</li>
                        </ul>
                        <button class="btn btn-outline-primary w-100 mt-3">Choose Basic</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 pricing-card pro-card shadow-lg text-center bg-primary text-white">
                    <div class="card-body">
                        <h4 class="card-title">Pro</h4>
                        <h2 class="fw-bold my-3">Rs. 499<span class="fs-6">/mo</span></h2>
                        <ul class="list-unstyled">
                            <li class="mb-2">10 Projects</li>
                            <li class="mb-2">Priority Support</li>
                            <li class="mb-2">50 GB Storage</li>
                        </ul>
                        <button class="btn btn-light w-100 mt-3">Choose Pro</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 pricing-card shadow-sm text-center">
                    <div class="card-body">
                        <h4 class="card-title">Enterprise</h4>
                        <h2 class="fw-bold my-3">Rs. 1499<span class="fs-6 text-muted">/mo</span></h2>
                        <ul class="list-unstyled text-muted">
                            <li class="mb-2">Unlimited Projects</li>
                            <li class="mb-2">Dedicated Manager</li>
                            <li class="mb-2">500 GB Storage</li>
                        </ul>
                        <button class="btn btn-outline-primary w-100 mt-3">Choose Enterprise</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
