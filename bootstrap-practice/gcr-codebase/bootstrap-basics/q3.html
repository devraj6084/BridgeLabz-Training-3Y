<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanCart - Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <header class="bg-white border-bottom py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="fw-bold m-0">UrbanCart</h2>
            <span class="text-muted">4 items available</span>
        </div>
    </header>

    <main class="container mb-5">
        <h3 class="mb-4 text-center">Our Products</h3>
        <div class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 product-card shadow-sm">
                    <img src="https://placehold.co/300x200" class="card-img-top" alt="Wireless Headphones">
                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="card-text text-muted">Rs. 2,499</p>
                        <button class="btn btn-dark w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 product-card shadow-sm">
                    <img src="https://placehold.co/300x200" class="card-img-top" alt="Smart Watch">
                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="card-text text-muted">Rs. 3,999</p>
                        <button class="btn btn-dark w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 product-card shadow-sm">
                    <img src="https://placehold.co/300x200" class="card-img-top" alt="Backpack">
                    <div class="card-body text-center">
                        <h5 class="card-title">Travel Backpack</h5>
                        <p class="card-text text-muted">Rs. 1,299</p>
                        <button class="btn btn-dark w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 product-card shadow-sm">
                    <img src="https://placehold.co/300x200" class="card-img-top" alt="Desk Lamp">
                    <div class="card-body text-center">
                        <h5 class="card-title">Desk Lamp</h5>
                        <p class="card-text text-muted">Rs. 899</p>
                        <button class="btn btn-dark w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 UrbanCart. All rights reserved.</p>
    </footer>

</body>
</html>
