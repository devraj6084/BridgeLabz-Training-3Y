<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive Cards with Media Queries</title>
	<link rel="stylesheet" href="q3.css">
</head>
<body>
	<header>
		<h1>Our Plans</h1>
	</header>
	<main class="card-row">
		<section class="card">
			<h2>Basic</h2>
			<p>Perfect for individuals starting out with essential features.</p>
		</section>
		<section class="card">
			<h2>Standard</h2>
			<p>Great for small teams that need more storage and support.</p>
		</section>
		<section class="card">
			<h2>Premium</h2>
			<p>Advanced tools for growing businesses and larger teams.</p>
		</section>
		<section class="card">
			<h2>Enterprise</h2>
			<p>Custom solutions with dedicated support for organizations.</p>
		</section>
	</main>
</body>
</html>
