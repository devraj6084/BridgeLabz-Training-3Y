<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <header>
        <h1>Pseudo-Classes Demo</h1>
    </header>

    <main class="row">
        <div class="item">
            <a href="#" class="link-demo">Hover Link</a>
            <p>:hover changes color</p>
        </div>

        <div class="item">
            <button class="btn-demo">Focus Button</button>
            <p>:focus shows outline</p>
        </div>

        <div class="item">
            <button class="btn-demo">Active Button</button>
            <p>:active changes background</p>
        </div>

        <div class="item">
            <ul class="list-demo">
                <li>Item One</li>
                <li>Item Two</li>
                <li>Item Three</li>
                <li>Item Four</li>
            </ul>
            <p>:nth-child colors alternate rows</p>
        </div>
    </main>
</body>
</html>
