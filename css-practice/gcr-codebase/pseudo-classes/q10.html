<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>
    <header>
        <h1>Mini User Interface</h1>
    </header>

    <main class="card">
        <img src="https://picsum.photos/100/100?random=7" alt="Profile Image" class="profile-img">

        <form class="card-form">
            <label for="uname">Name</label>
            <input type="text" id="uname" placeholder="Enter your name">

            <label for="uemail">Email</label>
            <input type="text" id="uemail" placeholder="Enter your email">

            <div class="btn-row">
                <button type="button" class="btn primary">Save</button>
                <button type="button" class="btn outline">Cancel</button>
            </div>
        </form>
    </main>

    <footer>
        <p>Footer Section</p>
    </footer>
</body>
</html>
