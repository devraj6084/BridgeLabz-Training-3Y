<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main class="stage">
        <div class="box box-px">
            <h2>px</h2>
            <p>180px x 180px</p>
        </div>

        <div class="box box-percent">
            <h2>%</h2>
            <p>width: 40%</p>
        </div>

        <div class="box box-vh">
            <h2>vh</h2>
            <p>height: 30vh</p>
        </div>

        <div class="box box-em">
            <h2>em</h2>
            <p>14em x 10em</p>
        </div>
    </main>
</body>
</html>
