<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <header>
        <h1>CSS Transformations</h1>
    </header>

    <main class="box-row">
        <div class="unit">
            <div class="box rotate-box"></div>
            <p>rotate</p>
        </div>

        <div class="unit">
            <div class="box scale-box"></div>
            <p>scale</p>
        </div>

        <div class="unit">
            <div class="box translate-box"></div>
            <p>translate</p>
        </div>

        <div class="unit">
            <div class="box skew-box"></div>
            <p>skew</p>
        </div>
    </main>
</body>
</html>
