<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors Practice</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>
    <header>
        <h1>CSS Selectors Practice</h1>
    </header>

    <main>
        <p class="highlight">This paragraph uses a class selector.</p>
        <p id="unique">This paragraph uses an ID selector.</p>
        <a href="https://example.com">This link uses an attribute selector.</a>

        <div class="list-section">
            <ul>
                <li>Parent list item</li>
                <li>
                    <span>Child span inside li</span>
                </li>
            </ul>
            <p>Sibling paragraph after the list</p>
        </div>
    </main>

    <footer>
        <p>Footer Section</p>
    </footer>
</body>
</html>
