<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive Image Filter Gallery</title>
	<link rel="stylesheet" href="q1.css">
</head>
<body>
	<header>
		<h1>Image Filter Gallery</h1>
	</header>
	<main>
		<section class="gallery">
			<figure class="gallery-item">
				<img src="https://picsum.photos/id/1015/400/300" alt="River between mountains" class="blur">
				<figcaption>Blur Effect</figcaption>
			</figure>
			<figure class="gallery-item">
				<img src="https://picsum.photos/id/1016/400/300" alt="Mountain range" class="grayscale">
				<figcaption>Grayscale Effect</figcaption>
			</figure>
			<figure class="gallery-item">
				<img src="https://picsum.photos/id/1018/400/300" alt="Forest road" class="sepia">
				<figcaption>Sepia Effect</figcaption>
			</figure>
			<figure class="gallery-item">
				<img src="https://picsum.photos/id/1021/400/300" alt="Beach shoreline" class="brightness">
				<figcaption>Brightness Effect</figcaption>
			</figure>
			<figure class="gallery-item">
				<img src="https://picsum.photos/id/1024/400/300" alt="Dog on grass" class="contrast">
				<figcaption>Contrast Effect</figcaption>
			</figure>
			<figure class="gallery-item">
				<img src="https://picsum.photos/id/1031/400/300" alt="Desert dunes" class="hue-rotate">
				<figcaption>Hue Rotate Effect</figcaption>
			</figure>
		</section>
	</main>
	<footer>
		<p>Hover over an image to remove its filter</p>
	</footer>
</body>
</html>
