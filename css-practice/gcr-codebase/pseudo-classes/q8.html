<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
    <header>
        <h1>Box-Sizing Comparison</h1>
    </header>

    <main class="row">
        <div class="box default-box">
            <p>content-box (default)</p>
            <p>width: 200px, padding: 20px, actual width becomes wider</p>
        </div>

        <div class="box border-box">
            <p>border-box</p>
            <p>width: 200px, padding: 20px, total width stays 200px</p>
        </div>
    </main>
</body>
</html>
