<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Filter Comparison Layout</title>
	<link rel="stylesheet" href="q8.css">
</head>
<body>
	<header>
		<h1>Before &amp; After Comparison</h1>
	</header>
	<main class="comparison-row">
		<figure class="compare-item">
			<img src="https://picsum.photos/id/1035/400/300" alt="Original mountain lake photo">
			<figcaption>Original</figcaption>
		</figure>
		<figure class="compare-item">
			<img src="https://picsum.photos/id/1035/400/300" alt="Enhanced mountain lake photo" class="enhanced">
			<figcaption>Enhanced</figcaption>
		</figure>
	</main>
</body>
</html>
